server:
  port: 8081

spring:
  application:
    name: lexai-gateway
  main:
    web-application-type: reactive
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/gateway
    username: gateway_user
    password: gateway_password
  data:
    r2dbc:
      repositories:
        enabled: true
  ai:
    anthropic:
      api-key: dummy-key
      chat:
        options:
          model: claude-opus-4-5-20251101
          temperature: 0.2
          max-tokens: 4096
      version: 2023-06-01

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: your-google-client-id
            client-secret: your-google-client-secret
            scope: openid,profile,email
            redirect-uri: http://localhost:8081/login/oauth2/code/google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            user-name-attribute: email

jwt:
  secret: dummy-key
  expiration: 86400
  refresh-expiration: 604800

app:
  file-service:
    url: ${FILE_SERVICE_URL:http://localhost:3001}
  http:
    connect-timeout: 30000 # 0.5 minute
    read-timeout: 300000    # 5 minutes for AI responses
    write-timeout: 60000 # 1 minute

logging:
  level:
    com.bntech.lexai.gateway.service.AIService: DEBUG
    com.bntech.lexai.gateway.security: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.r2dbc.core: ERROR
    reactor.netty.http.client: DEBUG

elasticsearch:
  enabled: true

management:
  health:
    elasticsearch:
      enabled: false

aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:4566}
    region: ${AWS_REGION:us-east-1}
    bucket-name: ${AWS_S3_BUCKET:lexai-documents}
    access-key: ${AWS_ACCESS_KEY:test}
    secret-key: ${AWS_SECRET_KEY:test}
