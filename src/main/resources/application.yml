server:
  port: 8081

spring:
  application:
    name: lexai-gateway
  main:
    web-application-type: reactive
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/lex-users
    username: root
    password: root
  data:
    r2dbc:
      repositories:
        enabled: true
  ai:
    anthropic:
      api-key: dummy-key
      chat:
        options:
          model: claude-3-7-sonnet-latest
          temperature: 0.2
          max-tokens: 4096
      version: 2023-06-01

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: your-google-client-id
            client-secret: your-google-client-secret
            scope: openid,profile,email
            redirect-uri: http://localhost:8081/login/oauth2/code/google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            user-name-attribute: email

jwt:
  secret: dummy-key
  expiration: 86400
  refresh-expiration: 604800

app:
  http:
    connect-timeout: 30000 # 0.5 minute
    read-timeout: 300000    # 5 minutes for AI responses
    write-timeout: 60000 # 1 minute

logging:
  level:
    com.bntech.lexai.gateway.service.AIService: DEBUG
    com.bntech.lexai.gateway.security: DEBUG
    org.springframework.ai: DEBUG
    reactor.netty.http.client: DEBUG
#  level:
#    org.springframework.security: DEBUG
#    org.springframework.security.oauth2: DEBUG

elasticsearch:
  enabled: true

management:
  health:
    elasticsearch:
      enabled: false
