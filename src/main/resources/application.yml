server:
  port: 8081

spring:
  application:
    name: lexai-gateway
  main:
    web-application-type: reactive
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/gateway
    username: gateway_user
    password: gateway_password
  data:
    r2dbc:
      repositories:
        enabled: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  ai:
    anthropic:
      api-key: ${SPRING_AI_ANTHROPIC_API_KEY:dummy-key}
      chat:
        options:
#          model: claude-opus-4-5-20251101
          model: claude-sonnet-4-5-20250929
          chat-model: claude-sonnet-4-5-20250929
          reasoning-temperature: 0.2
          creativity-temperature: 0.4
          max-tokens: 4096
      version: 2023-06-01

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-secret}
            scope: openid,profile,email
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8081/login/oauth2/code/google}
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: email

jwt:
  secret: ${JWT_SECRET:mySecret}
  expiration: 86400
  refresh-expiration: 604800

app:
  frontend-url: ${FRONTEND_URL:http://localhost:8080}
  ai:
    primary-provider: ${AI_PRIMARY_PROVIDER:anthropic}
    fallback-provider: ${AI_FALLBACK_PROVIDER:anthropic}
    openai-rollout-ratio: ${AI_OPENAI_ROLLOUT_RATIO:0.0}
    question-timeout-seconds: ${AI_QUESTION_TIMEOUT_SECONDS:50}
    openai:
      api-key: ${OPENAI_API_KEY:dummy-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-5.5}
      chat-model: ${OPENAI_CHAT_MODEL:gpt-5.5}
      reasoning-effort: ${OPENAI_REASONING_EFFORT:medium}
      question-reasoning-effort: ${OPENAI_QUESTION_REASONING_EFFORT:low}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:${app.frontend-url}}
  email:
    from: ${EMAIL_FROM:noreply@paragrafic.pl}
    enabled: ${EMAIL_ENABLED:false}
  file-service:
    url: ${FILE_SERVICE_URL:http://localhost:3001}
  http:
    connect-timeout: 30000 # 0.5 minute
    read-timeout: 300000    # 5 minutes for AI responses
    write-timeout: 60000 # 1 minute

subscription:
  service:
    url: ${SUBSCRIPTION_SERVICE_URL:http://localhost:3002}

postmark:
  api-token: ${POSTMARK_API_TOKEN:disabled}

logging:
  level:
    com.bntech.lexai.gateway.service.AIService: DEBUG
    com.bntech.lexai.gateway.security: DEBUG
    org.springframework.ai: INFO
    org.springframework.r2dbc.core: DEBUG
    reactor.netty.http.client: DEBUG

elasticsearch:
  enabled: true

management:
  health:
    elasticsearch:
      enabled: false

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:4566}
    region: ${AWS_REGION:us-east-1}
    bucket-name: ${AWS_S3_BUCKET:lexai-documents}
    access-key: ${AWS_ACCESS_KEY:test}
    secret-key: ${AWS_SECRET_KEY:test}
