server:
  port: 8081
spring:
  application:
    name: lexai-gateway
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/lex-users
    username: root
    password: root

  ai:
    anthropic:
      version: 2023-06-01
      api-key: token
      chat:
        options:
          temperature: 0.2
          max-tokens: 8192

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${google_client_id}
            client-secret: ${google_client_secret}
            scope:
              - email
              - profile
            provider: google
