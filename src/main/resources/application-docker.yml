spring:
  application:
    name: lexai-gateway
  main:
    web-application-type: reactive
  r2dbc:
    url: r2dbc:postgresql://postgres:5432/gateway
    username: gateway_user
    password: gateway_password
  datasource:
    url: jdbc:postgresql://postgres:5432/gateway
    username: gateway_user
    password: gateway_password
  sql:
    init:
      mode: never
  ai:
    anthropic:
      api-key: ${SPRING_AI_ANTHROPIC_API_KEY:dummy-key}
server:
  port: 8081

app:
  ai:
    primary-provider: ${AI_PRIMARY_PROVIDER:anthropic}
    fallback-provider: ${AI_FALLBACK_PROVIDER:anthropic}
    openai-rollout-ratio: ${AI_OPENAI_ROLLOUT_RATIO:0.0}
    question-timeout-seconds: ${AI_QUESTION_TIMEOUT_SECONDS:50}
    openai:
      api-key: ${OPENAI_API_KEY:dummy-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-5.5}
      chat-model: ${OPENAI_CHAT_MODEL:gpt-5.5}
      reasoning-effort: ${OPENAI_REASONING_EFFORT:medium}
      question-reasoning-effort: ${OPENAI_QUESTION_REASONING_EFFORT:low}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:8080,http://localhost:5173,http://127.0.0.1:5173,http://0.0.0.0:5173,null}

logging:
  level:
    com.bntech.lexai: DEBUG
    org.springframework.r2dbc: DEBUG

jwt:
  secret: dummy-key

aws:
  s3:
    endpoint: http://localstack:4566
